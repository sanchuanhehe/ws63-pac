name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

jobs:
  regenerate:
    name: SVD to PAC reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-09
          components: rust-src,clippy,rustfmt
      - name: Install the pinned PAC generator
        run: cargo install svd2rust --version 0.37.1 --locked
      - name: Regenerate without modifying the tracked PAC
        env:
          PAC_LIB: ${{ runner.temp }}/ws63-pac-lib.rs
        run: bash ws63-svd/regen.sh
      - name: Compare generated and committed PAC
        run: cmp "${{ runner.temp }}/ws63-pac-lib.rs" src/lib.rs
      - name: Reject generation side effects
        run: git diff --exit-code

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --locked --all-features
      - run: cargo check --locked --all-features --release

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --locked --all-features

  doc:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --locked --no-deps --document-private-items
